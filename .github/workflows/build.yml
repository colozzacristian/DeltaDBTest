name: Build

on:
  push:
    branches: [cli, main]
    tags: ["v*"]
  pull_request:
    branches: [cli, main]

permissions:
  contents: write # needed to publish GitHub Releases on tag pushes

jobs:
  # ── Type check (runs once, not per target) ────────────────────────────────
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "~2.9"

      - name: Check types
        run: |
          cd typescript
          deno check app.ts
          deno check src/index.ts

  # ── Cross-compile all targets from a single Ubuntu runner ─────────────────
  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: deno desktop does not support Windows ARM64 (no aarch64-pc-windows-msvc target).
          - name: Windows x86_64
            target: x86_64-pc-windows-msvc
            output: openajazz-windows-x86_64.msi

          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            output: openajazz-linux-x86_64.AppImage

          - name: Linux ARM64
            target: aarch64-unknown-linux-gnu
            output: openajazz-linux-arm64.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "~2.9"

      # Cache the downloaded deno desktop backends (webview runtime, denort)
      # so repeated builds don't re-download the same archives.
      - name: Cache deno desktop backends
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno/desktop
          key: deno-desktop-${{ matrix.target }}-${{ hashFiles('typescript/app.ts') }}
          restore-keys: |
            deno-desktop-${{ matrix.target }}-

      - name: Build ${{ matrix.name }}
        run: |
          cd typescript
          deno desktop --allow-env \
            --target ${{ matrix.target }} \
            --output ${{ matrix.output }} \
            app.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: typescript/${{ matrix.output }}

  # ── Publish a GitHub Release when a version tag is pushed ─────────────────
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
